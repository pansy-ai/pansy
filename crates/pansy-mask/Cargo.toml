[package]
name = "pansy-mask"
description = "pansy's privacy masking: secrets, personal data and the user's own words swapped for placeholders on the way to a vendor, and put back on the way home."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hmac = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
