[package]
name = "pansy-cli"
description = "The pansy command: providers, agents, groups and profiles from the terminal, and the headless gateway."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pansy"
path = "src/main.rs"

[dependencies]
pansy-core.workspace = true
pansy-agents.workspace = true
pansy-gateway.workspace = true
pansy-mask.workspace = true
pansy-plugins.workspace = true
chrono.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
