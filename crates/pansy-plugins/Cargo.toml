[package]
name = "pansy-plugins"
description = "magpie's community plugins on Bun: OpenCode provider plugins, pi packages, gateway middleware and request hooks, and agent plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pansy-core.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
hmac = "0.12"
http = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
uuid.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }
axum.workspace = true
