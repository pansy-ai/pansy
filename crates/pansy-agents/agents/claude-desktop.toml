# Claude Desktop on a third-party gateway, after magpie's claudedesktop.go
# (desktopOn and internal/desktopdir): a gateway profile in
# Claude-3p/configLibrary, listed and applied by its _meta.json, and
# deploymentMode "3p" in both claude_desktop_config.json files, written
# last. The folders are ~/Library/Application Support's on macOS,
# %LOCALAPPDATA%'s on Windows (its Claude folder there too, where Desktop's
# 3p mode reads it) and ~/.config's on Linux; a Desktop installed as an MSIX
# package keeps its own copies, which are not written. Desktop has no model
# key: it lists the gateway's /v1/models, and keeps only ids that read as
# Anthropic's, so the gateway shows it the others by an alias of their own
# (pansy-gateway's desktop.rs). The profile's id is a UUID as Desktop makes
# them, its last part "pansy" in hex.
id = "claude-desktop"
name = "Claude Desktop"
protocol = "anthropic"
dirs = ["{config}/Claude", "{local}/Claude-3p"]
lists_models = true
picks_in = "model menu"
note = "Claude Desktop reads this at start-up: quit and reopen it. It then runs with no Anthropic sign-in, Code and Cowork on pansy's models."

[files]
config = "{local}/Claude/claude_desktop_config.json"
config3p = "{local}/Claude-3p/claude_desktop_config.json"
profile = "{local}/Claude-3p/configLibrary/00000000-0000-4000-8000-0070616e7379.json"
meta = "{local}/Claude-3p/configLibrary/_meta.json"

[[set]]
file = "profile"
key = ["inferenceProvider"]
value = "gateway"

[[set]]
file = "profile"
key = ["inferenceGatewayBaseUrl"]
value = "{base_url}"

[[set]]
file = "profile"
key = ["inferenceGatewayApiKey"]
value = "{key}"

[[set]]
file = "profile"
key = ["inferenceGatewayAuthScheme"]
value = "bearer"

# Policies seeded once and then left to the user.
[[set]]
file = "profile"
key = ["disableDeploymentModeChooser"]
value = true

[[set]]
file = "profile"
key = ["coworkEgressAllowedHosts"]
value = ["*"]

[[set]]
file = "profile"
key = ["claudeAiImport"]
value = { enabled = true, bannerBehavior = "detect" }

[[set]]
file = "profile"
key = ["toolSearchEnabled"]
value = true

[[set]]
file = "meta"
key = ["entries", "[id=00000000-0000-4000-8000-0070616e7379]"]
value = { id = "00000000-0000-4000-8000-0070616e7379", name = "pansy" }

[[set]]
file = "meta"
key = ["appliedId"]
value = "00000000-0000-4000-8000-0070616e7379"

[[set]]
file = "config3p"
key = ["deploymentMode"]
value = "3p"

[[set]]
file = "config"
key = ["deploymentMode"]
value = "3p"

[base_url]
file = "profile"
key = ["inferenceGatewayBaseUrl"]

[run]
unsupported = "Claude Desktop is a desktop app that reads its gateway profile at start-up; connect it instead (pansy claude-desktop <model>)."
