# VS Code Insiders's chat, as magpie's vscode.go wires it: a Custom Endpoint group of
# its own in chatLanguageModels.json, each model sending the key as a Bearer
# token, and chat.defaultModel in settings.json. The default profile's
# files alone.
id = "vscode-insiders"
name = "VS Code Insiders"
protocol = "chat"
programs = ["code-insiders"]
dirs = [".config/Code - Insiders/User"]
picks_in = "Chat's model picker"
note = "pansy's models are in VS Code Insiders's Chat model picker, under pansy (VS Code 1.122 or later). If they don't show, run Developer: Reload Window."

[files]
settings = "{env:XDG_CONFIG_HOME|~/.config}/Code - Insiders/User/settings.json"
models = "{env:XDG_CONFIG_HOME|~/.config}/Code - Insiders/User/chatLanguageModels.json"

[[set]]
file = "models"
key = ["[name=pansy]"]

[set.value]
name = "pansy"
vendor = "customendpoint"
apiType = "chat-completions"
models = [{ "$each_model" = { id = "{id}", name = "{name}", url = "{v1}/chat/completions", toolCalling = true, vision = false, contextWindow = 128000, maxOutputTokens = 8192, requestHeaders = { Authorization = "Bearer {key}" } } }]

[[set]]
file = "settings"
key = ["chat.defaultModel"]
value = "{model}"

[model]
file = "settings"
key = ["chat.defaultModel"]

[run]
unsupported = "VS Code Insiders's chat reads its models from its files alone; connect it instead (pansy vscode-insiders <model>)."
