# Codex. `-c key=value` wins over config.toml for one run.
# A subagent runs on the model its lead names in spawn_agent, else on the
# lead's own; [agents] default_subagent_model takes one of Codex's own models
# alone (0.169.0 refuses any other: "Unknown model … for spawn_agent"), and
# the lead's pick wins over it. So the model for subagents goes with every
# request in a header of pansy's, and the gateway puts a subagent's
# (x-openai-subagent: collab_spawn) on it whatever it asked for.
id = "codex"
name = "Codex"
protocol = "responses"
programs = ["codex"]
dirs = [".codex"]
subagent_model = true
subagent_every = true

[files]
config = "{env:CODEX_HOME|~/.codex}/config.toml"

[[field]]
key = "effort"
kind = "effort"
levels = ["low", "medium", "high", "xhigh"]

[[set]]
file = "config"
key = ["model"]
value = "{model}"

[[set]]
file = "config"
key = ["model_provider"]
value = "pansy"

[[set]]
file = "config"
key = ["model_providers", "pansy", "name"]
value = "Pansy"

[[set]]
file = "config"
key = ["model_providers", "pansy", "base_url"]
value = "{v1}"

[[set]]
file = "config"
key = ["model_providers", "pansy", "wire_api"]
value = "responses"

[[set]]
file = "config"
key = ["model_providers", "pansy", "experimental_bearer_token"]
value = "{key}"

[[set]]
file = "config"
key = ["model_providers", "pansy", "http_headers", "x-pansy-subagent-model"]
value = "{subagent}"

[[set]]
file = "config"
key = ["model_reasoning_effort"]
value = "{effort}"

[base_url]
file = "config"
key = ["model_providers", "pansy", "base_url"]

[model]
file = "config"
key = ["model"]

[[install]]
via = "powershell"
command = 'powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"'
os = ["windows"]

[[install]]
via = "script"
command = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
os = ["linux", "macos"]

[[install]]
via = "brew"
command = "brew install --cask codex"
os = ["macos"]

[[install]]
via = "npm"
command = "npm install -g @openai/codex"

[run]
verified = "0.169.0"
args = [
  "-c", "model={model:q}",
  "-c", 'model_provider="pansy"',
  "-c", 'model_providers.pansy.name="Pansy"',
  "-c", "model_providers.pansy.base_url={v1:q}",
  "-c", 'model_providers.pansy.wire_api="responses"',
  "-c", "model_providers.pansy.experimental_bearer_token={key:q}",
]
subagent_args = ["-c", "model_providers.pansy.http_headers.x-pansy-subagent-model={subagent:q}"]
