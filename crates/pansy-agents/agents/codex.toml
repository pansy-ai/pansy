# Codex. `-c key=value` wins over config.toml for one run.
# [agents] default_subagent_model is the model of a subagent whose spawn names
# none. The lead may name one itself, which its config can't overrule: so the
# model goes with every request in a header of pansy's, and the gateway puts a
# subagent's (x-openai-subagent: collab_spawn) on it whatever it asked for.
id = "codex"
name = "Codex"
protocol = "responses"
programs = ["codex"]
dirs = [".codex"]
subagent_model = true
subagent_every = true

[files]
config = "{env:CODEX_HOME|~/.codex}/config.toml"

[[set]]
file = "config"
key = ["model"]
value = "{model}"

[[set]]
file = "config"
key = ["model_provider"]
value = "pansy"

[[set]]
file = "config"
key = ["model_providers", "pansy", "name"]
value = "Pansy"

[[set]]
file = "config"
key = ["model_providers", "pansy", "base_url"]
value = "{v1}"

[[set]]
file = "config"
key = ["model_providers", "pansy", "wire_api"]
value = "responses"

[[set]]
file = "config"
key = ["model_providers", "pansy", "experimental_bearer_token"]
value = "{key}"

[[set]]
file = "config"
key = ["agents", "default_subagent_model"]
value = "{subagent}"

[[set]]
file = "config"
key = ["model_providers", "pansy", "http_headers", "x-pansy-subagent-model"]
value = "{subagent}"

[base_url]
file = "config"
key = ["model_providers", "pansy", "base_url"]

[model]
file = "config"
key = ["model"]

[[install]]
via = "powershell"
command = 'powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"'
os = ["windows"]

[[install]]
via = "script"
command = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
os = ["linux", "macos"]

[[install]]
via = "brew"
command = "brew install --cask codex"
os = ["macos"]

[[install]]
via = "npm"
command = "npm install -g @openai/codex"

[run]
verified = "0.169.0"
args = [
  "-c", "model={model:q}",
  "-c", 'model_provider="pansy"',
  "-c", 'model_providers.pansy.name="Pansy"',
  "-c", "model_providers.pansy.base_url={v1:q}",
  "-c", 'model_providers.pansy.wire_api="responses"',
  "-c", "model_providers.pansy.experimental_bearer_token={key:q}",
]
subagent_args = [
  "-c", "agents.default_subagent_model={subagent:q}",
  "-c", "model_providers.pansy.http_headers.x-pansy-subagent-model={subagent:q}",
]
