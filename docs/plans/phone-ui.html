<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pansy 手机端 · 界面样稿</title>
<style>
/* Tokens: T3 Code's neutrals, pansy's indigo (docs/plans/phone-ui.md). */
:root, [data-theme=light] {
  --screen:#fcfcfc; --card:#ffffff; --grouped:#f4f4f5; --sheet:rgba(252,252,252,.98);
  --border:#e4e4e7; --line:rgba(228,228,231,.7);
  --fg:#27272a; --fg2:#6f6f79; --fg3:#71717b;
  --primary:#4f46e5; --primary-fg:#fff; --prominent:#27272a; --prominent-fg:#fcfcfc;
  --bubble:#efeff1; --composer:rgba(244,244,245,.94); --glass:rgba(255,255,255,.72);
  --warn-bg:#fcf4e8; --warn:#bb4d00; --danger-bg:#fcebec; --danger:#c10007;
  --sky:#0284c7; --indigo:#4f46e5; --emerald:#047857; --rose:#be123c; --violet:#6d28d9;
  --backdrop:rgba(0,0,0,.22); --shadow:rgba(0,0,0,.15); --gshadow:rgba(0,0,0,.08);
  --d-add:#d9f0eb; --d-del:#f5d9e6; --d-addbar:#05cc85; --d-delbar:#ff577a;
  --d-hunk:#d4ebfa; --d-hunkfg:#0073bd; --d-addfg:#008f57; --d-delfg:#e61a3d;
  --page:#e9e9ec;
}
[data-theme=dark] {
  --screen:#0a0a0a; --card:#111111; --grouped:#1a1b1b; --sheet:rgba(10,10,10,.98);
  --border:#191919; --line:rgba(40,40,40,.9);
  --fg:#f5f5f5; --fg2:#838383; --fg3:#818181;
  --primary:#a5b4fc; --primary-fg:#14142a; --prominent:#f5f5f5; --prominent-fg:#0a0a0a;
  --bubble:#161616; --composer:rgba(26,27,27,.9); --glass:rgba(30,30,30,.7);
  --warn-bg:#312108; --warn:#ffb900; --danger-bg:#301214; --danger:#ff6467;
  --sky:#38bdf8; --indigo:#a5b4fc; --emerald:#6ee7b7; --rose:#fda4af; --violet:#c4b5fd;
  --backdrop:rgba(0,0,0,.48); --shadow:rgba(0,0,0,.35); --gshadow:rgba(0,0,0,.22);
  --d-add:#05291a; --d-del:#2e0d14; --d-addbar:#05d18a; --d-delbar:#ff5c80;
  --d-hunk:#08242e; --d-hunkfg:#69d1ff; --d-addfg:#1ad68f; --d-delfg:#ff6185;
  --page:#050505;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--page); color:var(--fg); font:16px/23px "DM Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; transition:background .2s; }
.mono { font-family:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace; }
.top { position:sticky; top:0; z-index:50; display:flex; gap:16px; align-items:center; padding:14px 28px; background:var(--page); border-bottom:1px solid var(--border); }
.top h1 { font-size:18px; font-weight:700; }
.top p { font-size:13px; color:var(--fg2); flex:1; }
.top button { font:inherit; font-size:13px; padding:6px 14px; border-radius:99px; border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; }
.grid { display:flex; flex-wrap:wrap; gap:36px 28px; padding:28px; align-items:flex-start; }
figure { display:flex; flex-direction:column; gap:10px; }
figcaption { font-size:13px; color:var(--fg2); max-width:390px; line-height:18px; }
figcaption b { color:var(--fg); font-weight:700; }
.phone { position:relative; width:390px; height:844px; border-radius:48px; background:var(--screen); overflow:hidden; box-shadow:0 0 0 10px #111, 0 0 0 11px #333, 0 24px 60px rgba(0,0,0,.25); display:flex; flex-direction:column; }
.status { height:47px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 30px 6px 36px; font-size:15px; font-weight:700; }
.status .isl { position:absolute; left:50%; top:11px; width:122px; height:35px; margin-left:-61px; background:#000; border-radius:20px; }
.status .r { display:flex; gap:6px; align-items:center; }
.home-ind { position:absolute; bottom:8px; left:50%; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:var(--fg); opacity:.85; z-index:30; }
svg.i { width:var(--s,18px); height:var(--s,18px); stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; display:block; }
img.logo { width:var(--s,14px); height:var(--s,14px); flex:none; display:block; }
[data-theme=dark] img.logo[src*="openai"] { filter:invert(1); }
/* Navigation bar */
.nav { flex:none; height:52px; display:flex; align-items:center; gap:8px; padding:0 16px; position:relative; z-index:5; }
.nav .t { flex:1; min-width:0; text-align:center; }
.nav .t b { display:block; font-size:18px; line-height:23px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav .t small { display:block; font-size:12px; line-height:15px; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gbtn { width:38px; height:38px; border-radius:99px; display:flex; align-items:center; justify-content:center; background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border); color:var(--fg); box-shadow:0 4px 14px var(--gshadow); flex:none; cursor:pointer; }
.ggrp { display:flex; border-radius:99px; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--border); box-shadow:0 4px 14px var(--gshadow); }
.ggrp > * { width:38px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.body { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none; }
.body::-webkit-scrollbar { display:none; }
.body > *, .sbody > * { flex-shrink:0; }
/* Tab bar */
.tabs { flex:none; height:83px; display:flex; justify-content:space-around; padding:10px 40px 0; border-top:1px solid var(--line); background:var(--glass); backdrop-filter:blur(20px); }
.tabs > span { color:var(--fg3); }
.tabs > span.on { color:var(--primary); }
.tabs > span.off { opacity:.35; }
/* Chips, shelves, rows */
.chips { display:flex; gap:8px; padding:4px 20px 10px; overflow-x:auto; scrollbar-width:none; }
.chip { flex:none; display:flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:16px; font-size:14px; font-weight:500; background:var(--glass); border:1px solid var(--border); color:var(--fg); white-space:nowrap; }
.chip.on { background:var(--primary); color:var(--primary-fg); border-color:transparent; }
.shelf { display:flex; align-items:center; gap:8px; padding:14px 20px 6px; font-size:13px; line-height:17px; font-weight:500; color:var(--fg3); }
.shelf::after { content:""; flex:1; height:1px; background:var(--line); order:1; }
.shelf svg { order:2; --s:10px; }
.row { position:relative; padding:10px 20px; display:flex; flex-direction:column; gap:3px; cursor:pointer; }
.row + .row::before { content:""; position:absolute; top:0; left:20px; right:0; height:1px; background:var(--line); }
.row .l1 { display:flex; gap:8px; align-items:flex-start; }
.row .fav { width:20px; height:20px; border-radius:5px; flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; }
.row .ti { flex:1; min-width:0; font-size:16px; line-height:23px; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .st { flex:none; display:flex; align-items:center; gap:4px; font-size:13px; line-height:23px; font-weight:700; }
.row .st svg { --s:13px; }
.row .tm { flex:none; font-size:13px; line-height:23px; color:var(--fg3); }
.row .l2 { display:flex; gap:6px; align-items:center; padding-left:28px; font-size:13px; line-height:17px; color:var(--fg3); white-space:nowrap; overflow:hidden; }
.row .l2 .sep { opacity:.5; }
.row.busy .ti, .row.busy .l2, .row.busy .fav { opacity:.55; }
.row.slim { flex-direction:row; align-items:center; height:44px; padding:0 20px; gap:8px; }
.row.slim .fav { opacity:.4; margin:0; }
.row.slim .ti { font-weight:400; color:var(--fg2); -webkit-line-clamp:1; }
.row.slim .tm { font-size:14px; }
.add { color:var(--emerald); } .del { color:var(--rose); }
.c-sky{color:var(--sky)} .c-warn{color:var(--warn)} .c-indigo{color:var(--indigo)} .c-danger{color:var(--danger)} .c-emerald{color:var(--emerald)} .c-violet{color:var(--violet)} .c-fg2{color:var(--fg2)}
/* Swipe demo */
.swipe { display:flex; }
.swipe .row { flex:none; width:390px; transform:translateX(-116px); background:var(--screen); }
.swipe .acts { position:absolute; right:0; display:flex; height:100%; align-items:center; gap:0; padding-right:4px; }
.swipe .act { width:58px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; line-height:14px; color:var(--fg2); }
.swipe .act span { width:36px; height:36px; border-radius:99px; display:flex; align-items:center; justify-content:center; color:#fff; }
/* Thread */
.feed { padding:8px 16px 260px; display:flex; flex-direction:column; gap:14px; }
.ubub { align-self:flex-end; max-width:85%; background:var(--bubble); border-radius:20px; padding:10px 14px; }
.umeta { align-self:flex-end; margin-top:-8px; display:flex; gap:10px; font-size:13px; font-weight:500; color:var(--fg3); }
.amsg { padding:0 4px; font-size:16px; line-height:23px; }
.amsg p + p, .amsg p + ul, .amsg ul + p { margin-top:8px; }
.amsg ul { padding-left:20px; }
.amsg code { font-family:ui-monospace,Menlo,monospace; font-size:13.5px; background:var(--grouped); padding:1px 5px; border-radius:5px; }
.ameta { display:flex; gap:14px; align-items:center; padding:0 4px; color:var(--fg3); font-size:13px; }
.work { display:flex; flex-direction:column; gap:1px; }
.wrow { display:flex; align-items:center; gap:4px; min-height:28px; font-size:14px; line-height:19px; color:var(--fg2); cursor:pointer; }
.wrow .ic { width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
.wrow .ic svg { --s:15px; }
.wrow .tx { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wrow .ch { --s:11px; transition:transform .18s; }
.wrow.open .ch { transform:rotate(90deg); }
.wdet { display:none; margin-left:28px; max-height:240px; overflow:auto; background:var(--grouped); border-radius:8px; padding:8px 10px; font-size:12px; line-height:17px; color:var(--fg2); white-space:pre; }
.wrow.open + .wdet { display:block; }
.wrow.live .tx { background:linear-gradient(90deg,var(--fg2) 0%,var(--fg2) 40%,var(--fg) 50%,var(--fg2) 60%,var(--fg2) 100%); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shim 2.8s linear infinite; }
@keyframes shim { 0%{background-position:100% 0} 48%{background-position:0 0} 100%{background-position:0 0} }
.wrow.danger { color:var(--rose); }
.sub { display:flex; align-items:center; gap:8px; padding:6px 0; }
.sub .dot { width:6px; height:6px; border-radius:99px; }
.sub b { font-size:14px; font-weight:500; }
.sub small { font-size:13px; color:var(--fg2); flex:1; }
/* Bottom dock */
.dock { position:absolute; left:0; right:0; bottom:0; padding:0 12px 30px; display:flex; flex-direction:column; gap:10px; background:linear-gradient(to bottom, transparent, var(--screen) 34%); z-index:10; }
.pillbar { display:flex; gap:8px; align-items:center; justify-content:center; }
.capsule { height:44px; display:flex; align-items:center; border-radius:99px; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--border); box-shadow:0 8px 24px var(--gshadow); font-size:14px; }
.capsule > span { display:flex; align-items:center; gap:6px; padding:0 14px; height:100%; }
.capsule > span + span { border-left:1px solid var(--border); }
.capsule svg { --s:15px; }
.tick { font-family:system-ui; font-weight:700; font-variant-numeric:tabular-nums; }
.composer { min-height:56px; border-radius:27px; background:var(--composer); backdrop-filter:blur(20px); border:1px solid var(--border); box-shadow:0 6px 28px var(--shadow); display:flex; align-items:center; padding:6px; gap:2px; }
.composer .cb { width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--fg2); flex:none; }
.composer .ph { flex:1; font-size:16px; color:var(--fg3); padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mpill { display:flex; align-items:center; gap:5px; height:32px; padding:0 10px; border-radius:99px; background:var(--card); border:1px solid var(--border); font-size:13px; font-weight:500; flex:none; cursor:pointer; }
.send { width:32px; height:32px; border-radius:99px; background:var(--primary); color:var(--primary-fg); display:flex; align-items:center; justify-content:center; flex:none; margin:0 6px; }
.stop { width:32px; height:32px; border-radius:99px; background:var(--danger-bg); color:var(--danger); display:flex; align-items:center; justify-content:center; flex:none; }
.accbar { display:flex; gap:8px; padding:0 4px; }
.accbar .chip { height:30px; font-size:13px; }
/* Cards */
.card { border-radius:20px; border:1px solid var(--border); background:var(--card); padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:0 10px 30px var(--gshadow); }
.kick { font-size:12px; line-height:16px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--fg2); display:flex; justify-content:space-between; }
.card h3 { font-size:18px; line-height:23px; font-weight:700; }
.card .det { font-size:14px; line-height:19px; color:var(--fg2); }
.cmd { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:18px; background:var(--grouped); border-radius:8px; padding:8px 10px; white-space:pre-wrap; }
.btn { height:48px; border-radius:99px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:16px; font-weight:700; border:none; cursor:pointer; font-family:inherit; width:100%; }
.btn.p { background:var(--primary); color:var(--primary-fg); }
.btn.s { background:var(--grouped); color:var(--fg); }
.btn.d { background:var(--danger-bg); color:var(--danger); }
.btn.k { background:var(--prominent); color:var(--prominent-fg); }
.btn.o { background:var(--card); color:var(--fg); border:1px solid var(--border); }
.btns { display:flex; flex-direction:column; gap:8px; }
.opt { min-height:48px; border-radius:16px; border:1px solid var(--border); background:var(--grouped); padding:12px 14px; display:flex; flex-direction:column; gap:2px; cursor:pointer; }
.opt b { font-size:14px; line-height:19px; } .opt small { font-size:14px; color:var(--fg2); line-height:19px; }
.opt.on { border-color:var(--primary); background:color-mix(in srgb, var(--primary) 10%, transparent); }
/* Sheets */
.dim { position:absolute; inset:0; background:var(--backdrop); z-index:20; }
.sheet { position:absolute; left:0; right:0; bottom:0; z-index:21; background:var(--sheet); border-radius:28px 28px 0 0; display:flex; flex-direction:column; box-shadow:0 -10px 40px var(--gshadow); }
.grab { width:36px; height:5px; border-radius:3px; background:var(--fg3); opacity:.35; margin:6px auto 0; flex:none; }
.shead { display:flex; align-items:center; gap:8px; padding:8px 16px 6px; }
.shead .t { flex:1; text-align:center; }
.shead .t b { display:block; font-size:18px; line-height:23px; font-weight:700; }
.shead .t small { display:block; font-size:13px; line-height:17px; color:var(--fg2); }
.sbody { flex:1; overflow-y:auto; padding:6px 20px 34px; display:flex; flex-direction:column; gap:14px; scrollbar-width:none; }
.group { border-radius:24px; background:var(--grouped); overflow:hidden; }
.gh { font-size:13px; font-weight:500; color:var(--fg3); padding:0 16px; margin-bottom:-8px; }
.grow { display:flex; align-items:center; gap:12px; min-height:56px; padding:12px 16px; position:relative; cursor:pointer; }
.grow + .grow::before { content:""; position:absolute; top:0; left:50px; right:0; height:1px; background:var(--line); }
.grow.noic + .grow.noic::before { left:16px; }
.grow > svg { --s:22px; color:var(--fg2); }
.grow .gt { flex:1; min-width:0; }
.grow .gt b { display:block; font-size:16px; line-height:21px; font-weight:500; }
.grow .gt small { display:block; font-size:14px; line-height:19px; color:var(--fg2); }
.grow .gr { font-size:14px; color:var(--fg2); display:flex; align-items:center; gap:6px; }
.grow .gr svg { --s:14px; }
.check { color:var(--primary); --s:18px; }
.seg { display:flex; padding:3px; border-radius:10px; background:var(--grouped); }
.seg span { flex:1; text-align:center; font-size:13px; font-weight:500; padding:6px 0; border-radius:8px; color:var(--fg2); cursor:pointer; }
.seg span.on { background:var(--card); color:var(--fg); box-shadow:0 1px 3px var(--gshadow); }
.field { border-radius:12px; background:var(--grouped); padding:12px 14px; font-size:16px; color:var(--fg3); }
.bar { height:4px; border-radius:2px; background:var(--border); overflow:hidden; } .bar i { display:block; height:100%; background:var(--emerald); }
.note { border-radius:16px; padding:10px 14px; font-size:14px; line-height:19px; display:flex; gap:8px; align-items:flex-start; }
.note.w { background:var(--warn-bg); color:var(--warn); }
.note.d { background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger); }
.toggle { width:51px; height:31px; border-radius:99px; background:var(--border); position:relative; flex:none; }
.toggle::after { content:""; position:absolute; left:2px; top:2px; width:27px; height:27px; border-radius:99px; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); }
.toggle.on { background:#34c759; } .toggle.on::after { left:22px; }
/* Diff */
.dfile { margin:8px 8px 0; border-radius:10px; border:1px solid var(--border); background:var(--card); height:44px; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:12px; }
.dfile b { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dl { display:flex; height:22px; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:22px; white-space:pre; position:relative; }
.dl .n { width:46px; flex:none; text-align:right; padding-right:8px; font-size:11px; color:var(--fg3); }
.dl.a { background:var(--d-add); } .dl.a::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--d-addbar); }
.dl.r { background:var(--d-del); } .dl.r::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--d-delbar); }
.dl.h { background:var(--d-hunk); color:var(--d-hunkfg); padding-left:12px; }
.dl.sel { outline:2px solid var(--primary); outline-offset:-2px; }
/* Desktop panel */
.desk { width:860px; height:620px; border-radius:12px; overflow:hidden; background:var(--screen); box-shadow:0 0 0 1px var(--border), 0 24px 60px rgba(0,0,0,.2); display:flex; flex-direction:column; }
.desk .wbar { height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:1px solid var(--border); font-size:13px; color:var(--fg2); }
.desk .wbar i { width:12px; height:12px; border-radius:99px; background:var(--border); display:block; }
.desk .side { width:200px; flex:none; border-right:1px solid var(--border); padding:12px 8px; display:flex; flex-direction:column; gap:2px; font-size:14px; }
.desk .side span { padding:7px 10px; border-radius:8px; color:var(--fg2); }
.desk .side span.on { background:var(--grouped); color:var(--fg); font-weight:500; }
.desk .main { flex:1; overflow:auto; padding:24px 28px; display:flex; flex-direction:column; gap:16px; }
.qr { width:132px; height:132px; flex:none; border-radius:12px; background:#fff; padding:10px; }
</style>
</head>
<body>
<div class="top">
  <h1>pansy 手机端 · 界面样稿</h1>
  <p>照 T3 Code 的手机端：中性色、字号、圆角、动效照它，强调色是 pansy 的靛蓝。点工作记录可展开，点分段控件可切换。设计说明见 phone-ui.md。</p>
  <button onclick="theme()">切换深浅色</button>
</div>
<div class="grid">
<!-- 1. Chats -->
<figure>
<div class="phone">
  <div class="status"><span>9:41</span><div class="isl"></div><span class="r"><i data-i="wifi" style="--s:16px"></i><i data-i="battery" style="--s:22px"></i></span></div>
  <div class="nav">
    <img src="../../assets/brand/pansy-glyph.svg" style="width:20px;height:20px" alt="">
    <span style="font-size:21px;font-weight:500;color:var(--fg2);letter-spacing:-.5px">pansy</span>
    <span style="flex:1"></span>
    <span class="gbtn"><i data-i="sliders"></i></span>
    <span class="gbtn"><i data-i="pen"></i></span>
  </div>
  <div class="body">
    <div class="chips">
      <span class="chip on"><i data-i="laptop" style="--s:15px"></i>全部机器<i data-i="down" style="--s:12px"></i></span>
      <span class="chip">全部项目<i data-i="down" style="--s:12px"></i></span>
      <span class="chip">全部 agent<i data-i="down" style="--s:12px"></i></span>
    </div>
