# P0 of docs/plans/plugin-host.md: drives magpie's plugin host (host.js on
# Bun) from Rust. A workspace of its own: never part of pansy's builds.
[workspace]

[package]
name = "plugin-host-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
