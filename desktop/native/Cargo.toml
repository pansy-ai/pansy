[package]
name = "pansy-desktop-native"
description = "What the pansy window (App.tsx) imports from pansy/native: providers, agents, groups, profiles, usage, settings and the gateway."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pansy-core = { path = "../../crates/pansy-core" }
pansy-agents = { path = "../../crates/pansy-agents" }
pansy-gateway = { path = "../../crates/pansy-gateway" }
pansy-mask = { path = "../../crates/pansy-mask" }
pansy-plugins = { path = "../../crates/pansy-plugins" }
anyhow = "1"
nsh-core = "=0.6.0"
nsh-base = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tracing = "0.1"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
