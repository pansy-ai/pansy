[package]
name = "pansy-desktop"
description = "pansy: the desktop window with the gateway beside it, and the pansy command."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pansy"
path = "src/main.rs"

[dependencies]
pansy-desktop-native = { path = "../native" }
pansy-cli = { path = "../../crates/pansy-cli" }
nsh-core = "=0.5.1"
nsh-base = "=0.5.1"
nsh-engine = { version = "=0.5.1", default-features = false, features = ["js-core"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.5.1", default-features = false, features = ["js"] }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "=0.5.1", default-features = false, features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.5.1", default-features = false, features = ["js"] }

[build-dependencies]
winresource = "0.1"
